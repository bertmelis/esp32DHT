name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  cpplint:
    name: cpplint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cpplint
        run: python -m pip install cpplint==2.0.2

      - name: cpplint
        # Keep Arduino's unsigned long/short API types.
        run: >-
          python -m cpplint
          --repository=.
          --recursive
          --linelength=120
          --verbose=4
          --filter=-build/include,-build/header_guard,-runtime/int
          ./src

  build:
    name: Build (${{ matrix.board }} / ${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - lolin_s3_mini
          - nodemcu-32s
          - lolin_s2_mini
          - lolin_c3_mini
          - esp32-c6-devkitc-1
        example:
          - DHT22
          - DHT22_multiple
    env:
      PIO_BOARD: ${{ matrix.board }}
      PLATFORMIO_SRC_DIR: ${{ github.workspace }}/examples/${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ env.PYTHON_VERSION }}-${{ matrix.board }}-${{ hashFiles('platformio.ini', '.github/workflows/ci.yaml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ env.PYTHON_VERSION }}-${{ matrix.board }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio>=6.2.0"

      - name: Build example
        run: pio run --environment ci
