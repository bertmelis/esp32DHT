[platformio]
default_envs = esp32-s3
lib_dir = .
; src_dir = examples/DHT22
src_dir = examples/DHT22_multiple

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
build_flags =
  -Wall
  -Wextra
  -D CONFIG_ARDUHAL_LOG_COLORS
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file

[env:esp32-s3]
board = lolin_s3_mini

[env:esp32-s2]
board = lolin_s2_mini

[env:esp32-c3]
board = lolin_c3_mini

[env:esp32]
board = nodemcu-32s

[env:esp32-c6]
board = esp32-c6-devkitc-1

; CI can select any supported board without changing this file.
[env:ci]
board = ${sysenv.PIO_BOARD}
